[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vqls-cert"
version = "0.1.0"
description = "Shot and noise cost of certifying Variational Quantum Linear Solver precision with the condition-number bound"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Degala Chenchupradeep" }]
dependencies = ["numpy", "scipy", "pandas", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
